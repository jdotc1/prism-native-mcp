[project]
name = "prism-native-mcp"
version = "0.1.0"
description = "Local MCP integration for native GraphPad Prism 11.1 on macOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp==2.1.1",
    "pydantic==2.12.5",
    "openpyxl==3.1.5",
    "pyobjc-framework-quartz==12.2.2",
    "pyobjc-framework-vision==12.2.2",
]

[dependency-groups]
dev = ["pytest==9.0.3", "scipy==1.17.1", "pymupdf==1.26.7"]

[project.scripts]
prism-mcp = "prism_mcp.server:main"
prism-native = "prism_mcp.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
